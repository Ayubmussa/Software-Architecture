name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gateway/package-lock.json
      - run: cd gateway && npm ci
      - run: cd gateway && npm run build

  user-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/user-service/package-lock.json
      - run: cd services/user-service && npm ci
      - run: cd services/user-service && npm test
        continue-on-error: true

  product-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cd services/product-service && pip install -r requirements.txt
      - run: cd services/product-service && python -c "from app.main import app; print('OK')"

  order-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - run: cd services/order-service && chmod +x mvnw && ./mvnw -q compile

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/frontend-app/package-lock.json
      - run: cd frontend/frontend-app && npm ci
      - run: cd frontend/frontend-app && npm run build
